{% extends "base.html" %}
{% block content %}
  <h1>Log in</h1>
  {% if error %}<p role="alert"><strong>{{ error }}</strong></p>{% endif %}
  <form method="post" action="login">
    <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">
    <p><label>Email<br><input type="email" name="email" value="{{ email }}" required autofocus autocomplete="username"></label></p>
    <p><label>Password<br><input type="password" name="password" required autocomplete="current-password"></label></p>
    <p><button type="submit">Log in</button></p>
  </form>
{% endblock %}
